<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Daily Planner</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#262626;font:14px system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:white;border:1px solid #ddd;border-radius:7px;padding:9px 13px}button:hover{background:#f3f3f3}aside{position:fixed;inset:0 auto 0 0;width:190px;background:#fafafa;border-right:1px solid #eee;padding:28px 16px}aside button{display:block;width:100%;text-align:left;margin:8px 0;border:0;background:transparent}.active{background:#eaeaea!important;font-weight:bold}main{margin-left:190px;padding:32px;max-width:1450px}h1{font-size:30px;margin:8px 0}small{color:#888}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.primary{background:#262626;color:white;border-color:#262626}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{border:1px solid #e8e8e8;border-radius:10px;padding:14px}.stat b{display:block;font-size:25px;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #eee;border-left:1px solid #eee}.cell{min-height:110px;border-right:1px solid #eee;border-bottom:1px solid #eee;padding:7px;min-width:0;cursor:pointer}.weekday{min-height:30px;text-align:center;background:#fafafa}.hour{display:flex;min-height:62px;border-bottom:1px solid #eee}.time{width:65px;padding:12px 0;color:#888}.slot{flex:1;min-width:0;padding:4px;cursor:pointer}.slot:hover{background:#fafafa}.task{background:#f5f5f5;border-left:3px solid #999;border-radius:4px;padding:7px;margin:4px 0;display:flex;gap:6px;align-items:center;overflow-wrap:anywhere;cursor:pointer}.high{border-left-color:#b45d55}.low{border-left-color:#ccc}.done{text-decoration:line-through;opacity:.5}.task span{min-width:0;flex:1}.compact{font-size:11px;padding:4px}.compact small{display:none}input[type=checkbox]{accent-color:#333}input:not([type=checkbox]),select{border:1px solid #ddd;border-radius:6px;padding:9px;min-width:0;background:white}dialog{border:1px solid #ddd;border-radius:12px;width:min(460px,92vw);padding:22px}dialog::backdrop{background:#0004}label{display:flex;flex-direction:column;gap:5px;margin:10px 0}label input,label select{width:100%}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.goal{padding:8px 0;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center}.goal span{flex:1}.today{background:#f1f1f1}.outside{color:#aaa}.notice{color:#555;margin:12px 0}#timeline{max-height:65vh;overflow:auto}@media(max-width:650px){aside{width:83px;padding:20px 5px}aside button{padding:10px 5px}main{margin-left:83px;padding:12px}h1{font-size:23px}.stat{padding:8px}.stat b{font-size:20px}.cell{min-height:65px;padding:3px}.compact{font-size:10px}.compact input{display:none}.week{grid-template-columns:1fr}.time{width:44px}.brand{font-size:11px}}
 .selected{background:#292929!important;color:#fff}.selected .outside{color:#ddd}.monthmark{display:block;font-size:10px;opacity:.7;margin-top:5px}.monthdetail{margin-top:24px;border:1px solid #eee;border-radius:10px;padding:15px}.monthdetail .task{min-height:44px}.monthgrid .cell{min-height:64px;text-align:center}.monthgrid .weekday{min-height:30px}.monthdetail h3{margin:0 0 8px}.fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{min-width:0}.fields input,.fields select{display:block;width:100%;max-width:100%;min-width:0;min-height:44px;font-size:16px}.fields input[type=date]{appearance:none;-webkit-appearance:none;text-align:left;padding:9px 6px}.fields input[type=date]::-webkit-date-and-time-value{text-align:left;min-width:0}dialog{max-height:90dvh;overflow:auto}@media(max-width:480px){dialog{padding:18px}.fields{grid-template-columns:minmax(0,1fr);gap:0}.fields label{margin:7px 0}}</style></head><body><aside><b class="brand">PLANNER.</b><p><small>每日排程</small></p><button data-view="month">月計畫</button><button data-view="week">週計畫</button><button data-view="day">日計畫</button><hr style="border:0;border-top:1px solid #eee"><button id="today">回到今天</button><button id="backup">備份資料</button></aside><main id="main"></main><dialog id="editor"><form id="form"><h2 id="formtitle">新增行程</h2><label>任務名稱<input id="name" required></label><div class="fields"><label>日期<input type="date" id="edate" required></label><label>優先級<select id="priority"><option value="high">高</option><option value="medium" selected>中</option><option value="low">低</option></select></label><label>開始時間<select id="start"></select></label><label>結束時間<select id="end"></select></label><label>重複排程<select id="repeat"><option value="none">不重複</option><option value="daily">每天</option><option value="weekday">週一至週五</option><option value="weekly">每週</option></select></label><label>分類<select id="category"><option>讀書</option><option>課程</option><option>考古題</option><option>英文</option><option>生活</option><option>運動</option><option>休息</option><option>其他</option></select></label></div><p id="error" role="alert"></p><div class="row"><button class="primary" type="submit">儲存</button><button type="button" id="cancel">取消</button><button type="button" id="singleRoll">順延一天</button><button type="button" id="del">刪除本次</button><button type="button" id="series">刪除系列</button></div></form></dialog><script>
const $=id=>document.getElementById(id),key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),parse=s=>new Date(s+'T12:00:00'),plus=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},time=h=>String(h).padStart(2,'0')+':00',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),wd=['日','一','二','三','四','五','六'];
let data={tasks:[],overrides:{},goals:[]},date=new Date(),view='day',editing=null,notice='';try{let s=localStorage.getItem('zhixu-planner-v2');if(s)data=JSON.parse(s)}catch(e){notice='無法讀取本機資料'}
function save(){try{localStorage.setItem('zhixu-planner-v2',JSON.stringify(data))}catch(e){notice='儲存失敗，請備份資料'}}
const week=()=>plus(date,-((date.getDay()+6)%7)),period=()=>view==='month'?key(date).slice(0,7):view==='week'?key(week()):key(date);
function occurs(t,k){return k>=t.date&&(!t.until||k<=t.until)&&(t.repeat==='daily'||t.repeat==='weekday'&&![0,6].includes(parse(k).getDay())||t.repeat==='weekly'&&parse(k).getDay()===parse(t.date).getDay()||t.repeat==='none'&&k===t.date)}
function onDay(d){let k=typeof d==='string'?d:key(d);return data.tasks.filter(t=>occurs(t,k)).map(t=>({...t,...data.overrides[t.id+'@'+k],date:k,oid:t.id+'@'+k})).filter(t=>!t.hidden).sort((a,b)=>a.hour-b.hour||['high','medium','low'].indexOf(a.priority)-['high','medium','low'].indexOf(b.priority))}
function find(id){return onDay(id.split('@')[1]).find(t=>t.oid===id)}
function patch(t,p){data.overrides[t.oid]={...data.overrides[t.oid],...p}}
function roll(t){patch(t,{hidden:true});data.tasks.push({id:uid(),name:t.name,date:key(plus(parse(t.date),1)),hour:t.hour,end:t.end,priority:t.priority,category:t.category,repeat:'none',done:false})}
function card(t,compact=false){return '<div class="task '+t.priority+(compact?' compact':'')+'" data-task="'+t.oid+'"><input type="checkbox" data-check="'+t.oid+'" '+(t.done?'checked':'')+'><span class="'+(t.done?'done':'')+'"><small>'+time(t.hour)+'–'+time(t.end)+' · '+({high:'高',medium:'中',low:'低'}[t.priority])+'優先 '+(t.repeat!=='none'?'↻':'')+'</small><div>'+esc(t.name)+'</div></span></div>'}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let first=new Date(date.getFullYear(),date.getMonth(),1),n=new Date(date.getFullYear(),date.getMonth()+1,0).getDate(),days=view==='day'?[date]:view==='week'?Array.from({length:7},(_,i)=>plus(week(),i)):Array.from({length:n},(_,i)=>plus(first,i)),ts=days.flatMap(onDay),done=ts.filter(t=>t.done).length,title=view==='month'?date.getFullYear()+' 年 '+(date.getMonth()+1)+' 月':view==='week'?key(week())+' — '+key(plus(week(),6)):key(date)+' 星期'+wd[date.getDay()],body='';
if(view==='day')body='<div class="row between"><h3>每日時間軸</h3><button id="roll">未完成順延 →</button></div><div id="timeline">'+Array.from({length:24},(_,h)=>'<div class="hour"><div class="time">'+time(h)+'</div><div class="slot" data-hour="'+h+'">'+ts.filter(t=>t.hour===h).map(t=>card(t)).join('')+ts.filter(t=>t.hour<h&&t.end>h).map(t=>'<small data-task="'+t.oid+'">│ '+esc(t.name)+'（持續中）</small><br>').join('')+'</div></div>').join('')+'</div>';
else{let offset=(first.getDay()+6)%7,ds=view==='week'?days:Array.from({length:Math.ceil((offset+n)/7)*7},(_,i)=>plus(first,i-offset));body='<div class="grid '+(view==='week'?'week':'monthgrid')+'">'+(view==='month'?['一','二','三','四','五','六','日'].map(w=>'<div class="cell weekday">'+w+'</div>').join(''):'')+ds.map(d=>'<div class="cell '+(key(d)===key(date)&&view==='month'?'selected':key(d)===key(new Date())?'today':'')+'" data-date="'+key(d)+'"><b class="'+(view==='month'&&d.getMonth()!==date.getMonth()?'outside':'')+'">'+(view==='week'?'星期'+wd[d.getDay()]+' ':'')+d.getDate()+'</b>'+(view==='month'?(onDay(d).length?'<span class="monthmark">'+onDay(d).filter(t=>t.done).length+'/'+onDay(d).length+'</span>':''):onDay(d).map(t=>card(t,true)).join(''))+'</div>').join('')+'</div>'}
if(view==='month'){let selected=onDay(date),goals=data.goals.filter(g=>g.view==='day'&&g.period===key(date));body+='<section class="monthdetail"><div class="row between"><h3>'+key(date)+' 星期'+wd[date.getDay()]+'</h3><button id="dayadd">＋ 新增任務</button></div><small>'+selected.filter(t=>t.done).length+' / '+selected.length+' 已完成</small><h4>當日目標</h4>'+(goals.length?goals.map(g=>'<div class="goal"><input type="checkbox" data-goal="'+g.id+'" '+(g.done?'checked':'')+'><span class="'+(g.done?'done':'')+'">'+esc(g.name)+'</span></div>').join(''):'<small>尚未設定當日目標</small>')+'<h4>當日任務</h4>'+(selected.length?selected.map(t=>card(t)).join(''):'<p><small>當天尚無排程</small></p>')+'</section>'}
$('main').innerHTML='<small>PERSONAL PLANNER</small><div class="row between"><h1>'+title+'</h1><button class="primary" id="add">＋ 新增</button></div><div class="row"><button id="prev">‹</button><button id="next">›</button><input type="date" id="jump" value="'+key(date)+'"></div><div class="stats">'+[['總任務',ts.length],['已完成',done],['完成率',ts.length?Math.round(done/ts.length*100)+'%':'0%']].map(([l,v])=>'<div class="stat"><small>'+l+'</small><b>'+v+'</b></div>').join('')+'</div><div class="row between"><h3>'+({day:'今日',week:'本週',month:'本月'}[view])+'目標</h3><button id="goaladd">＋ 新增目標</button></div>'+data.goals.filter(g=>g.view===view&&g.period===period()).map(g=>'<div class="goal"><input type="checkbox" data-goal="'+g.id+'" '+(g.done?'checked':'')+'><span class="'+(g.done?'done':'')+'">'+esc(g.name)+'</span><button data-goaldel="'+g.id+'">×</button></div>').join('')+'<p class="notice">'+esc(notice)+'</p>'+body+'<p><small>資料儲存於目前瀏覽器，尚未同步雲端。</small></p>'}
$('start').innerHTML=Array.from({length:24},(_,i)=>'<option value="'+i+'">'+time(i)+'</option>').join('');$('end').innerHTML=Array.from({length:24},(_,i)=>'<option value="'+(i+1)+'">'+time(i+1)+'</option>').join('');
function open(h=8,id=null){editing=id;let t=id?find(id):null;$('formtitle').textContent=t?'編輯行程':'新增行程';$('name').value=t?.name||'';$('edate').value=t?.date||key(date);$('edate').disabled=!!t;$('start').value=t?.hour??h;$('end').value=t?.end??h+1;$('priority').value=t?.priority||'medium';$('repeat').value=t?.repeat||'none';$('repeat').disabled=false;$('category').value=t?.category||'讀書';$('singleRoll').hidden=!t||t.done;$('del').hidden=!t;$('series').hidden=!t||t.repeat==='none';$('error').textContent='';$('editor').showModal()}
$('form').onsubmit=e=>{e.preventDefault();let h=+$('start').value,end=+$('end').value,name=$('name').value.trim(),dt=$('edate').value;if(!name||end<=h){$('error').textContent='請輸入名稱，結束時間須晚於開始時間。';return}let obj={name,hour:h,end,priority:$('priority').value,category:$('category').value};if(editing){let t=find(editing),repeat=$('repeat').value;if(repeat===t.repeat)patch(t,obj);else{if(t.repeat!=='none'&&!confirm('變更重複設定將從本次日期起套用，之前的紀錄保留。確定嗎？'))return;let base=data.tasks.find(x=>x.id===t.id);base.until=key(plus(parse(t.date),-1));data.tasks.push({...obj,id:uid(),date:t.date,repeat,done:t.done||false})}}else data.tasks.push({...obj,id:uid(),date:dt,repeat:$('repeat').value,done:false});date=parse(dt);save();$('editor').close();render()};
$('cancel').onclick=()=>$('editor').close();$('singleRoll').onclick=()=>{let t=find(editing);if(t&&!t.done)roll(t);save();$('editor').close();render()};$('del').onclick=()=>{patch(find(editing),{hidden:true});save();$('editor').close();render()};$('series').onclick=()=>{if(!confirm('刪除整個重複系列？'))return;let t=find(editing);data.tasks=data.tasks.filter(x=>x.id!==t.id);Object.keys(data.overrides).filter(k=>k.startsWith(t.id+'@')).forEach(k=>delete data.overrides[k]);save();$('editor').close();render()};
document.addEventListener('click',e=>{if(e.target.closest('dialog')||e.target.matches('input,select'))return;let b=e.target.closest('button,[data-task],[data-date],[data-hour]');if(!b)return;let d=b.dataset;notice='';if(d.task){open(8,d.task);return}if(d.view)view=d.view;else if(d.date){date=parse(d.date);if(view!=='month')view='day'}else if(d.hour!==undefined){open(+d.hour);return}else if(b.id==='add'||b.id==='dayadd'){open();return}else if(b.id==='today'){date=new Date();view='day'}else if(b.id==='prev'||b.id==='next'){let n=b.id==='prev'?-1:1;if(view==='month'){date.setDate(1);date.setMonth(date.getMonth()+n)}else date=plus(date,n*(view==='week'?7:1))}else if(b.id==='roll'){let ts=onDay(date).filter(t=>!t.done);ts.forEach(roll);notice='已順延 '+ts.length+' 項任務；保留原時段，請確認時間衝突。';save()}else if(b.id==='goaladd'){let name=prompt('輸入目標');if(name?.trim()){data.goals.push({id:uid(),name:name.trim(),view,period:period(),done:false});save()}}else if(d.goaldel){data.goals=data.goals.filter(g=>g.id!==d.goaldel);save()}else if(b.id==='backup'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='planner-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}render()});
document.addEventListener('change',e=>{let d=e.target.dataset;if(e.target.id==='jump'&&e.target.value)date=parse(e.target.value);else if(d.check){patch(find(d.check),{done:e.target.checked});save()}else if(d.goal){data.goals.find(g=>g.id===d.goal).done=e.target.checked;save()}else return;render()});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
